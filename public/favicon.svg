<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background: Forest Green (#14532D) with no rounded corners -->
  <rect width="32" height="32" fill="#14532D" />

  <!-- Flat Zigzag Pulse Line: Paper Off-White (#F3EFE6) with sharp miter joints -->
  <polyline 
    points="5,16.5 11,16.5 14,24.5 18,6.5 21.5,23.5 24,16.5 27,16.5" 
    fill="none" 
    stroke="#F3EFE6" 
    stroke-width="2.5" 
    stroke-linejoin="miter" 
    stroke-linecap="square" 
    stroke-miterlimit="4"
  />

  <!-- Terminating Mustard Square Dot (#E0A526) -->
  <rect x="25.5" y="15.25" width="2.5" height="2.5" fill="#E0A526" />
</svg>
